packages:
  - "packages/*"
  - "apps/*"
  - "server"

# 让 `"*"` 这种普通版本范围也指向工作区内的包。
#
# 为什么服务端用 `"*"` 而不是 `workspace:*`（这一点很不直观）：
#   Dockerfile 的生产阶段用 **npm** 安装打包好的 tarball：
#       npm install ./sync-core.tgz ./shared-schema.tgz
#   npm **不认识** `workspace:*` 协议，会直接报错 —— 而 `"*"` 能被 tarball 满足。
#   上游正是出于这个原因才用 `"*"`。
#   本地开发则靠下面这个开关，让 pnpm 把 `"*"` 解析到工作区内的包（软链）。
linkWorkspacePackages: true

# 供应链安全：pnpm 默认不允许依赖执行 postinstall 脚本。
# 这里只显式放行**确实需要**执行脚本的包，其余保持默认拒绝。
allowBuilds:
  # esbuild 需要 postinstall 放置平台二进制，否则 tsup / vitest 无法运行
  esbuild: true
  # Prisma 需要 postinstall 下载查询引擎并生成客户端
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # 🔴 electron 这条**必须有**，但要搞清它是为了什么 —— 不是"为了下载二进制"。
  #
  # 【它解决的问题】不给显式决定，**所有 pnpm 命令都会失败**：
  #   2026-09-27 实测，删掉这条之后任何 `pnpm <script>` 都报
  #     [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: electron@44.4.5
  #   （pnpm 跑任何脚本前会先做依赖状态检查，所以卡住的是整个仓库，不只是 desktop。）
  #
  # 【一个必须知道的副作用】🔴 **pnpm 会自己往这个文件里写东西。**
  #   处于上面那种状态时，pnpm 往 `allowBuilds:` 下注入了一行占位符：
  #       electron: set this to true or false
  #   也就是说它会**改动一个提交进仓库的配置文件**。看到那行占位符不要去提交它 ——
  #   要么改成 `true`，要么改成 `false` 表示确实要禁掉。
  #
  # 【它**不**解决什么 —— 与直觉相反，一并记下免得误判】
  #   置 `true` 之后 `pnpm install` 并**不会**把 Electron 的运行时二进制下下来：
  #   实测已安装的 electron 包 `package.json` 里**没有 `scripts` 字段**，
  #   install 输出一直是 "Already up to date"，`path.txt` 始终不存在。
  #   二进制必须显式取：
  #       node node_modules/.pnpm/electron@*/node_modules/electron/install.js
  #   而且**必须带代理 + `NODE_USE_ENV_PROXY=1`** —— Node 的 `fetch`（undici）
  #   默认**不读** `HTTP_PROXY`/`HTTPS_PROXY`，否则只报 `TypeError: fetch failed`，
  #   完全看不出是代理问题。完整诊断链见 docs/runbooks/desktop.md §4.1。
  electron: true

# ⚠️ 必须显式声明，不能依赖默认值 —— 否则构建结果取决于**跑的是哪个 pnpm**。
#
# 实测踩到的坑：本机（DSH 内置 pnpm）该值为 0，而 Docker 里 corepack 装的原生
# pnpm 11 默认是 **24 小时**。同一份 lockfile，本地 `pnpm install` 成功，
# 容器里 `pnpm install --frozen-lockfile` 却报：
#   "The lockfile contains entries that the active policies reject"
# 并列出刚发布不久的 @rollup/rollup-* 与 @rolldown/binding-*。
# 这类"本地绿、CI 红"的差异最难排查，所以在这里钉死。
#
# 为什么 0 是可接受的：安全性由**提交进仓库的 lockfile + --frozen-lockfile** 保证 ——
# 精确版本与完整性哈希都已固定，不存在"解析时被换成新发布的恶意版本"的窗口。
# minimumReleaseAge 防的是**解析阶段**拿到太新的包，而我们的解析结果早已冻结。
#
# 若将来想启用该策略（例如允许定期升级依赖），把它改成正整数即可，
# 但要注意：改完必须重新解析并提交 lockfile，否则容器构建会再次失败。
minimumReleaseAge: 0
