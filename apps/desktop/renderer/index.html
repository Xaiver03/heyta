<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP 写死。桌面壳里放松 CSP 的代价比网页高 —— 它能读本地文件系统。

      🔴 与第一版（占位页）的区别：那时脚本是**内联**的，所以放行 'unsafe-inline'；
      现在是打包产物，脚本/样式都是**同目录下的文件**，于是收紧成 'self'。
      唯一保留 'unsafe-inline' 的是 style —— React 会给元素加 style 属性。

      `connect-src 'none'` 是刻意的：渲染进程**不需要**网络 ——
      一切数据都经 `window.heytaDesktop` 走 IPC 由主进程代办。
      真放开了，一个 XSS 就能把用户数据外发。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'"
    />
    <title>heyta</title>
  </head>
  <body>
    <!--
      真正的产品界面由 `@heyta/ui` 的共享组件渲染（M1 判据第 4 条：
      桌面端加载的是**同一套**共享 UI，不是另写一份）。
    -->
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
