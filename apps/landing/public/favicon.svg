<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512" role="img" aria-label="heyta">
  <!--
    生成物（scripts/gen-app-icons.mjs）—— 不要手改。
    几何来自 packages/design-system/src/brand-mark.ts（全站唯一一份「h」），
    色值来自 design-system token（SVG 的表现属性写不了 var()，所以是生成进来的字面值）。

    ⚠️ 这段注释里**不许出现两个连续的连字符** —— XML 注释不允许，
       写坏了整份 SVG 就是非法文档：浏览器不显示图标而渲染一个 XML 错误页，
       而 HTTP 层仍然是 200 + image/svg+xml，光看响应码发现不了。
  -->
  <rect width="512" height="512" rx="112" fill="#2563eb"/>
  <rect x="140" y="120" width="52" height="272" rx="22" fill="#ffffff"/>
  <rect x="320" y="228" width="52" height="164" rx="22" fill="#ffffff"/>
  <rect x="140" y="228" width="232" height="48" rx="22" fill="#ffffff"/>
</svg>
