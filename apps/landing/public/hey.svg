<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 144" role="img" aria-label="hey.">
  <!--
    「hey.」品牌字标 —— 独立资源版本（带品牌蓝渐变，适合大尺寸/对外使用）。

    ⚠️ 导航栏里用的**不是这个文件**，而是 apps/landing/src/components/BrandMark.tsx。
    两者几何完全相同（同一套 262×144 坐标），但配色方式不同，原因如下：
      · 这个文件是自包含的，色值必须烘死，无法跟随亮/暗主题；
      · 组件用 currentColor，亮色走 blue-600、暗色走 blue-400，随主题自动切换，
        且不写死色值（组件里禁裸 hex）。
      · 另外 CSS var() 在 SVG 表现属性里不生效，所以组件里也没法靠 token 做渐变。
    改其中一个，务必同步另一个。

    坐标系统（三个字母对齐到同一条基线才站得住）：
      baseline     y = 100
      x-height     y = 62    → x 高度 38
      ascender     y = 22    → "h" 的竖干
      descender    y = 128   → "y" 的尾巴
      笔画半径 r = 19 = x 高度 / 2，stroke-width 16（半笔 8）

    间距按**墨迹边缘**算，不按路径端点：
      "h" 右缘 78 到 "e" 左缘 91   → 实距 13
      "e" 右缘 145 到 "y" 左缘 158 → 实距 13

    句点半径 8 = 笔画半宽（与圆头笔画同粗），圆心 cy=92 让圆点**坐在**基线上。

    ⚠️ XML 注释里不能出现连续两个连字符，所以上面提到色值时都不带令牌名的前导连字符。
  -->
  <defs>
    <!-- 品牌蓝渐变：亮端 blue-400，主色端 blue-600 -->
    <linearGradient
      id="hey-gradient"
      gradientUnits="userSpaceOnUse"
      x1="32"
      y1="22"
      x2="204"
      y2="128"
    >
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!--
    "h"：竖干 M32 22 V100；肩部从 (32,81) 用半径 19 的半圆拱到 (70,81)，再落到基线。
    "e"：横杠 M99 81 H137，接着从横杠右端逆时针扫 290° 到 70° 处收笔。
         ⚠️ 开口角度不能小：圆头端帽半径就有 8px，两端各补 8px ——
         留 45° 时缺口弦长仅 14.5px，会被端帽完全堵死，"e" 就读成了 θ。
         70° 时弦长约 24px，扣掉端帽还能留下看得见的开口。
    "y"：两笔斜线收到 (185,96)，右笔顺势下探成尾巴，末端向左勾。
  -->
  <path
    d="M32 22V100 M32 81a19 19 0 0 1 38 0V100 M99 81h38a19 19 0 1 0-12.5 17.85 M166 62l19 34 M204 62l-19 34 M185 96q0 26-18 26"
    fill="none"
    stroke="url(#hey-gradient)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="230" cy="92" r="8" fill="#2563eb" />
</svg>
