<!doctype html>
<!--
  由 `scripts/gen-entries.mjs` 生成，**不要手改**。
  改站点结构去 `src/site/pages.ts`，改这一页的文案去 `packages/i18n`，
  改头部形状改 `scripts/entry-template.html`，然后跑：

      pnpm --filter @heyta/landing gen:entries

  🔴 为什么是"生成"而不是"每页手写一份 HTML"：
  站点有 7 个页面 × 2 种语言 = 14 份入口。手写的话，每一份都要自己写对
  `<html lang>`、`<title>`、`<meta description>`、canonical、hreflang 三件套、
  主题引导脚本 —— 六处 × 14 份 = 84 处可以漂移的地方，而**任何一处漂移都不是
  报错，是静默地少收一份流量**（比如某页忘了 hreflang，那页的中英两版就会
  互相抢排名）。生成之后这些地方各自只有一份，且 `seo-head.spec.ts` 会逐入口查。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- favicon 来源见 public/favicon.svg 的文件头：由品牌自己的蓝点 + 字标首字母构成 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>帮助中心 —— heyta</title>
    <meta name="description" content="heyta 帮助中心：怎么建任务、怎么同步、忘了加密口令怎么办、通行密钥怎么用、四象限怎么归类、重复任务怎么设、专注怎么用、怎么导出数据、怎么自建服务器、数据到底放在哪。" />

    <!--
      hreflang 三件套：告诉搜索引擎这一页的**两个语言版本**是同一个页面，
      而不是两份互相重复的内容。少了它，两版会互相抢排名。
      x-default 指向中文版（主站），用于语言未匹配时的兜底。

      ⚠️ 三件套里的每一条都**指向本页**的对应语言版本（不是首页）——
      子页面的 hreflang 指向首页是本类站点最常见的一种错，而它的表现是
      "英文版功能页永远进不了索引"。
    -->
    <link rel="canonical" href="https://heyta.waytofuture.cn/docs/" />
    <link rel="alternate" hreflang="zh-CN" href="https://heyta.waytofuture.cn/docs/" />
    <link rel="alternate" hreflang="en" href="https://heyta.waytofuture.cn/en/docs/" />
    <link rel="alternate" hreflang="x-default" href="https://heyta.waytofuture.cn/docs/" />
    <!--
      Open Graph / Twitter 卡片。

      🔴 `og:url` 必须**等于 canonical**（同一个事实源算出来，不另写一遍）：
      两者不一致时平台会抓一个、搜索引擎认另一个，而分享出去的链接
      指的其实是第三个。所以它们都从 `urlFor(page, locale)` 来。

      🔴 `og:image` 必须是**绝对地址 + 位图**（1200×630）：
      SVG 在微信 / X / Slack 的卡片里普遍不渲染，声明了等于没声明；
      相对地址则会让平台抓不到。图由 `pnpm --filter @heyta/landing gen:og`
      从 `scripts/og-card.html` 生成，产物签进仓库。

      🔴 这里**没有** `aggregateRating` 与任何评分/评论数据：我们还没有真实用户，
      编一个会被结构化数据校验逮住，也会在搜索结果里显示一个假星级。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="heyta" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="帮助中心 —— heyta" />
    <meta property="og:description" content="heyta 帮助中心：怎么建任务、怎么同步、忘了加密口令怎么办、通行密钥怎么用、四象限怎么归类、重复任务怎么设、专注怎么用、怎么导出数据、怎么自建服务器、数据到底放在哪。" />
    <meta property="og:url" content="https://heyta.waytofuture.cn/docs/" />
    <meta property="og:image" content="https://heyta.waytofuture.cn/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="heyta 分享卡片：本地优先的任务管理，数据先落你自己的设备；端到端加密同步、可自建自托管、不按功能收费。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="帮助中心 —— heyta" />
    <meta name="twitter:description" content="heyta 帮助中心：怎么建任务、怎么同步、忘了加密口令怎么办、通行密钥怎么用、四象限怎么归类、重复任务怎么设、专注怎么用、怎么导出数据、怎么自建服务器、数据到底放在哪。" />
    <meta name="twitter:image" content="https://heyta.waytofuture.cn/og-card.png" />

    <!--
      结构化数据。由 `scripts/gen-entries.mjs` 的 `jsonLdFor()` 生成：
      每个页面都有一条 `SoftwareApplication`（产品是什么），
      而 `/pricing` 与 `/help` 额外带一条 `FAQPage`（页面上的问答就是真问答）。

      🔴 **没有价格**：价格只在词条表里写一次，而 `check:pricing` 核对的是那四处。
      在 JSON-LD 里再写一遍价格，就是第五处 —— 而它在生成的 HTML 里，
      门禁扫不到，漂移了也没人知道。
    -->
    <script type="application/ld+json">[
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "heyta",
    "url": "https://heyta.waytofuture.cn",
    "description": "heyta 帮助中心：怎么建任务、怎么同步、忘了加密口令怎么办、通行密钥怎么用、四象限怎么归类、重复任务怎么设、专注怎么用、怎么导出数据、怎么自建服务器、数据到底放在哪。",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web, Windows, macOS, Linux, Android, iOS",
    "inLanguage": "zh-CN"
  },
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "inLanguage": "zh-CN",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "怎么建一条任务？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "在任务列表上方输入标题，按回车添加。也可以写“明天下午三点交周报”，检查识别出的日期后提交。点击任务即可在详情中补充备注、清单和标签。"
        }
      },
      {
        "@type": "Question",
        "name": "换设备了，数据怎么过去？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "开启联网并登录 heyta，默认使用官方服务同步，无需填写服务器地址或令牌。在“应用设置 → 账号同步”查看连接状态。首次配置加密时，请妥善保存恢复信息；其他设备需要使用相同的加密凭据。"
        }
      },
      {
        "@type": "Question",
        "name": "忘了加密口令怎么办？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "如果已经设置加密数据钥匙并保存了恢复码，可以在同步设置中用恢复码解锁，随后设置新口令并保存新的恢复码。登录密码重置不能解锁数据。若口令和恢复码都丢失，服务端无法替你恢复；仍能读取数据的旧设备可以先导出留底。尚未迁移的旧口令密文仍需要原口令。"
        }
      },
      {
        "@type": "Question",
        "name": "通行密钥怎么用？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "登录时选「通行密钥」，用设备本身的人脸 / 指纹 / 系统 PIN 确认即可，没有密码可记，也没有密码可撞库。丢了的话，应用里的登录面板有「丢失了通行密钥？发一封找回链接」，会发一封找回邮件，点进去可以注册一条新的。⚠️ 最后一条凭据不允许被删除 —— 删掉就进不去了。"
        }
      },
      {
        "@type": "Question",
        "name": "怎么换绑登录邮箱？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "在设置页的「账号」里点「更换登录邮箱」并填新地址。heyta 会同时给当前邮箱和新邮箱各发一封信，两边各点一次才生效 —— 任何一边没点，什么都不会变。链接 24 小时内有效，生效时其他设备上的登录会一起失效，你要用新邮箱重新登录。如果当前邮箱已经收不到信（注册时填错、停用），这条路走不通：双侧确认正是这件事安全的地方，那种情况只能联系那台服务器的运营方。"
        }
      },
      {
        "@type": "Question",
        "name": "怎么退出某一台设备？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "设置页的「账号」里有一张「登录设备」列表：每条会话写着什么时候登录、最近一次使用、来自哪个浏览器标识，每条都能单独登出。「退出这一台」只撤销那一枚令牌，别的设备继续用；要一次清掉就点「退出所有设备」。修改口令与换绑邮箱也会把其它设备的登录一并作废。"
        }
      },
      {
        "@type": "Question",
        "name": "四象限是怎么归类的？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "象限是当场算出来的，不是给任务打的标签：紧迫与否看截止日期是否落在近期窗口内，重要与否看你自己标的重要标记（没标过就按优先级推导）。所以改截止日期或优先级，任务会自动换格 —— 不会出现\"象限和任务对不上\"。"
        }
      },
      {
        "@type": "Question",
        "name": "重复任务怎么设？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "在 Web 与移动端都能设：打开任务详情选常用预设（每天 / 每周 / 工作日 / 每月），也可以直接写一条自定义规则。勾掉一条重复任务时，下一次到期日按规则顺延，基准是原本的到期日而不是\"你几点勾的\"。顺延的算法与各端差别见「重复任务：勾掉之后，下一次怎么算」。"
        }
      },
      {
        "@type": "Question",
        "name": "专注（番茄钟）怎么用？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "在专注页选一条任务开始计时，结束后这一次专注会记入成长统计。时长可以自己改（默认 25 分钟专注 / 5 分钟休息），改完会记住 —— 刷新页面后仍是新值。"
        }
      },
      {
        "@type": "Question",
        "name": "怎么把数据带走？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "三端都能导出：Web 在设置页、移动端在「我的」里走系统分享面板、命令行用 export。但只有 Web 与命令行能导回，而且只能还原到一个空库 —— 移动端没有导入入口。详见「把数据带走、带回来」。"
        }
      },
      {
        "@type": "Question",
        "name": "怎么自己搭一套？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "可以使用自己的同步服务器。部署、升级与备份步骤请查看“自托管同步服务”；连接入口位于应用同步设置的高级选项。"
        }
      },
      {
        "@type": "Question",
        "name": "数据到底放在哪？",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "任务先保存在本机。开启同步后，任务内容以端到端加密形式上传；服务端仍可看到同步时间和设备标识等元数据。AI 使用独立的数据授权，具体发送内容请查看“AI 功能与数据流向”。"
        }
      }
    ]
  }
]</script>
    <!--
      主题引导：在样式表之前同步执行，避免暗色用户看到一帧亮色（FOUC）。
      与 `src/lib/theme.ts` 共用同一个 storage key —— 两处不一致会让
      刷新后主题闪一下，而那种闪烁很容易被当成"渲染 bug"去查错方向。

      语言**不在这里**引导，与主题刻意不同：主题是纯偏好（无 URL 语义），
      语言有 URL 语义（`/x` 与 `/en/x`），由路径决定，见 `src/site/paths.ts`。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('heyta.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
