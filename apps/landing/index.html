<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- favicon 来源见 public/favicon.svg 的文件头：由品牌自己的蓝点 + 字标首字母构成 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>heyta：本地优先的任务管理，可自建自托管</title>
    <meta
      name="description"
      content="heyta 是一个本地优先的任务管理应用：数据先落本地，云端只是同步通道，服务端看不到明文。功能对标滴答清单，可以完全用自己的服务器。"
    />

    <!--
      hreflang 三件套：告诉搜索引擎 `/` 与 `/en/` 是**同一页面的两个语言版本**，
      而不是两份互相重复的内容。少了它，两版会互相抢排名。
      x-default 指向中文版（主站），用于语言未匹配时的兜底。
    -->
    <link rel="canonical" href="https://heyta.finlaw.cloud/" />
    <link rel="alternate" hreflang="zh-CN" href="https://heyta.finlaw.cloud/" />
    <link rel="alternate" hreflang="en" href="https://heyta.finlaw.cloud/en/" />
    <link rel="alternate" hreflang="x-default" href="https://heyta.finlaw.cloud/" />
    <!--
      主题引导：在样式表之前同步执行，避免暗色用户看到一帧亮色（FOUC）。
      与 `src/lib/theme.ts` 共用同一个 storage key —— 两处不一致会让
      刷新后主题闪一下，而那种闪烁很容易被当成"渲染 bug"去查错方向。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('heyta.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
