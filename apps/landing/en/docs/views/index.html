<!doctype html>
<!--
  由 `scripts/gen-entries.mjs` 生成，**不要手改**。
  改站点结构去 `src/site/pages.ts`，改这一页的文案去 `packages/i18n`，
  改头部形状改 `scripts/entry-template.html`，然后跑：

      pnpm --filter @heyta/landing gen:entries

  🔴 为什么是"生成"而不是"每页手写一份 HTML"：
  站点是「每个页面 × 每种语言 = 一份入口」，**现量多少份由 `src/site/pages.ts`
  与 `@heyta/i18n` 的 `LOCALES` 决定** —— 这里刻意不写数字：写过一次
  "7 个页面 × 2 种语言 = 14 份"，而注册表涨到 38 页之后它就成了假话。
  手写的话，每一份都要自己写对 `<html lang>`、`<title>`、`<meta description>`、
  canonical、hreflang 三件套、`og:*`、结构化数据与主题引导脚本 ——
  每一处 × 每一份都是可以漂移的地方，而**任何一处漂移都不是报错，
  是静默地少收一份流量**（比如某页忘了 hreflang，那页的中英两版就会互相抢排名）。
  生成之后这些地方各自只有一份，且 `seo-head.spec.ts` 会逐入口查。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- favicon 来源见 public/favicon.svg 的文件头：由品牌自己的蓝点 + 字标首字母构成 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quadrants, calendar, timeline and search — heyta</title>
    <meta name="description" content="Plan dates in the calendar, prioritize with quadrants and review with timeline and search." />

    <!--
      hreflang 三件套：告诉搜索引擎这一页的**两个语言版本**是同一个页面，
      而不是两份互相重复的内容。少了它，两版会互相抢排名。
      x-default 指向中文版（主站），用于语言未匹配时的兜底。

      ⚠️ 三件套里的每一条都**指向本页**的对应语言版本（不是首页）——
      子页面的 hreflang 指向首页是本类站点最常见的一种错，而它的表现是
      "英文版功能页永远进不了索引"。
    -->
    <link rel="canonical" href="https://heyta.waytofuture.cn/en/docs/views/" />
    <link rel="alternate" hreflang="zh-CN" href="https://heyta.waytofuture.cn/docs/views/" />
    <link rel="alternate" hreflang="en" href="https://heyta.waytofuture.cn/en/docs/views/" />
    <link rel="alternate" hreflang="x-default" href="https://heyta.waytofuture.cn/docs/views/" />
    <!--
      Open Graph / Twitter 卡片。

      🔴 `og:url` 必须**等于 canonical**（同一个事实源算出来，不另写一遍）：
      两者不一致时平台会抓一个、搜索引擎认另一个，而分享出去的链接
      指的其实是第三个。所以它们都从 `urlFor(page, locale)` 来。

      🔴 `og:image` 必须是**绝对地址 + 位图**（1200×630）：
      SVG 在微信 / X / Slack 的卡片里普遍不渲染，声明了等于没声明；
      相对地址则会让平台抓不到。图由 `pnpm --filter @heyta/landing gen:og`
      从 `scripts/og-card.html` 生成，产物签进仓库。

      🔴 这里**没有** `aggregateRating` 与任何评分/评论数据：我们还没有真实用户，
      编一个会被结构化数据校验逮住，也会在搜索结果里显示一个假星级。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="heyta" />
    <meta property="og:locale" content="en_US" />
    <!--
      `og:locale:alternate` 与 hreflang 说的是**同一件事**（这一页还有另一种语言），
      但出口不同：hreflang 给搜索引擎，这一条给**分享卡片的抓取器**
      （Facebook / Slack / 微信读 OG，不读 hreflang）。少了它，中文页被分享到
      英文语境里时，平台不知道还有一份英文版可挑。
    -->
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:title" content="Quadrants, calendar, timeline and search — heyta" />
    <meta property="og:description" content="Plan dates in the calendar, prioritize with quadrants and review with timeline and search." />
    <meta property="og:url" content="https://heyta.waytofuture.cn/en/docs/views/" />
    <meta property="og:image" content="https://heyta.waytofuture.cn/og-card-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="heyta share card: local-first task management where your data lands on your own device first; end-to-end encrypted sync, self-hostable, no feature gating." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quadrants, calendar, timeline and search — heyta" />
    <meta name="twitter:description" content="Plan dates in the calendar, prioritize with quadrants and review with timeline and search." />
    <meta name="twitter:image" content="https://heyta.waytofuture.cn/og-card-en.png" />

    <!--
      结构化数据。由 `scripts/gen-entries.mjs` 的 `jsonLdFor()` 生成：
      每个页面都有一条 `SoftwareApplication`（产品是什么），
      而 `/pricing` 与 `/help` 额外带一条 `FAQPage`（页面上的问答就是真问答）。

      🔴 **没有价格**：价格只在词条表里写一次，而 `check:pricing` 核对的是那四处。
      在 JSON-LD 里再写一遍价格，就是第五处 —— 而它在生成的 HTML 里，
      门禁扫不到，漂移了也没人知道。

      🔴 **2026-10-19 SEO 审计逐条否决了下面四种"看起来该有"的节点**，
      理由是同一个：**结构化数据必须与页面上可见的事实一致**（说了的要能核对）。
      不要因为它们"常见"就顺手加回来 —— 每一条的否决理由都不同：

      | 没加的 | 为什么不能加 |
      |---|---|
      | `BreadcrumbList` | 文档页**没有可见面包屑**（`DocsShell` 只有顶栏 logo→枢纽与一个首页链接）。给一个页面上不存在的层级做标记，属于"给搜索引擎看、给用户看不了" |
      | `Organization` | 没有 ≥112×112 的方形位图商标（仓库里只有 SVG favicon 与 1200×630 分享卡），而 `logo` 缺了会报错、乱写会显示破图位；且 heyta 目前**不是一个已登记的组织实体** |
      | `WebSite.potentialAction`（SearchAction） | 站内搜索是**纯前端**的（`DocsSearch`），没有可被抓取的搜索 URL 形状（没有 `?q=` 这类路由契约）。声明一个不存在的搜索端点就是编数据 |
      | `Article` / `TechArticle` | 帮助文章**没有逐篇的发布/更新时间**，而这两个字段是这两个类型的承重字段 |
    -->
    <script type="application/ld+json">[
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "heyta",
    "url": "https://heyta.waytofuture.cn",
    "description": "Plan dates in the calendar, prioritize with quadrants and review with timeline and search.",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web, Windows, macOS, Linux, Android, iOS",
    "inLanguage": "en"
  }
]</script>
    <!--
      主题引导：在样式表之前同步执行，避免暗色用户看到一帧亮色（FOUC）。
      与 `src/lib/theme.ts` 共用同一个 storage key —— 两处不一致会让
      刷新后主题闪一下，而那种闪烁很容易被当成"渲染 bug"去查错方向。

      语言**不在这里**引导，与主题刻意不同：主题是纯偏好（无 URL 语义），
      语言有 URL 语义（`/x` 与 `/en/x`），由路径决定，见 `src/site/paths.ts`。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('heyta.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
