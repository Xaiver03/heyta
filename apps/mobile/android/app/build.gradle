apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ─────────────────────────────────────────────────────────────────────────────
// 发布签名的读取与告警
// ─────────────────────────────────────────────────────────────────────────────
//
// 放在 `android { }` **外面**：`signingConfigs` 块里读属性时，属性必须先已解析。
// 用 `providers.gradleProperty(...)` 而不是裸 `project.property(...)`，
// 是为了让"来自 gradle.properties"与"来自环境变量"走同一条惰性路径，
// 不必在配置阶段就判断存在性。

/** 依次找 gradle 属性 → 环境变量。找不到返回 null（**不是空串**）。 */
def heytaSigningValue = { String key ->
    def fromProperty = providers.gradleProperty(key).orNull
    if (fromProperty != null && !fromProperty.trim().isEmpty()) return fromProperty.trim()
    def fromEnv = providers.environmentVariable(key).orNull
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    return null
}

def heytaReleaseStoreFile = heytaSigningValue('HEYTA_RELEASE_STORE_FILE')
def heytaReleaseStorePassword = heytaSigningValue('HEYTA_RELEASE_STORE_PASSWORD')
def heytaReleaseKeyAlias = heytaSigningValue('HEYTA_RELEASE_KEY_ALIAS')
def heytaReleaseKeyPassword = heytaSigningValue('HEYTA_RELEASE_KEY_PASSWORD')

def heytaHasReleaseSigning = [
    heytaReleaseStoreFile, heytaReleaseStorePassword,
    heytaReleaseKeyAlias, heytaReleaseKeyPassword,
].every { it != null }

if (heytaHasReleaseSigning) {
    logger.lifecycle("[heyta] 发布签名：已配置（keystore = ${heytaReleaseStoreFile}）")
} else {
    logger.lifecycle("""
[heyta] ⚠️⚠️⚠️  未配置发布签名，release 构建将使用**调试 keystore**  ⚠️⚠️⚠️
[heyta]   调试 keystore 是**公开**的（口令 'android' / 'android'），
[heyta]   用它签名的包**不能上架**，且任何持有公开密钥的人都能签出同身份的更新包。
[heyta]   只把它用于内测。
[heyta]   配发布签名：在 ~/.gradle/gradle.properties 里加这四项（keystore 不要进仓库）
[heyta]     HEYTA_RELEASE_STORE_FILE=/绝对路径/heyta-upload.keystore
[heyta]     HEYTA_RELEASE_STORE_PASSWORD=…
[heyta]     HEYTA_RELEASE_KEY_ALIAS=…
[heyta]     HEYTA_RELEASE_KEY_PASSWORD=…
[heyta]   生成 keystore：keytool -genkeypair -v -storetype PKCS12 \\
[heyta]     -keystore heyta-upload.keystore -alias heyta -keyalg RSA -keysize 2048 -validity 10000
[heyta]   详见 docs/runbooks/multi-platform-build.md
""".stripIndent())
}


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.heytamobile"
    defaultConfig {
        applicationId "com.heytamobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // 🔴 放开明文 HTTP。这不是图省事，是自建场景的可用性刚需。
        //
        // React Native 的 Gradle 插件把 **非 debuggable** 变体的
        // `usesCleartextTraffic` 设成 `false`。后果：release 包里把服务器地址填成
        // `http://192.168.1.10:3000`（自托管最常见的样子：NAS / 家里的小主机 /
        // 容器直接起在局域网）**必然连不上**，而且失败发生在网络层 ——
        // OkHttp 抛出的 TypeError 里往往没有原因字符串，界面只能显示「当前离线」。
        // 实测就是这样：服务端用 curl 一切正常，应用却坚称离线。
        //
        // 为什么敢放开：heyta 的载荷**始终是端到端加密**的（AES-256-GCM，
        // 密钥由口令在本地派生），服务端从头到尾看不到明文。明文信道真正暴露的是
        // **访问令牌**与元数据（op 数量、时间、体积），不是任务内容本身。
        //
        // 风险由应用层承担而不是忽略：填 `http://` 时界面会明确警告，
        // 用户是知情选择，不是被默默降级。决策记录见 `docs/adr/0007-*`。
        //
        // ⚠️ 真正生效的设置在文件末尾的 `androidComponents.finalizeDsl` ——
        // 写在这里的 manifestPlaceholders **会被插件覆盖**，见那里的说明。
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        /**
         * 发布签名。**keystore 绝不进仓库** —— 它只从 Gradle 属性或环境变量读。
         *
         * 四个键（任一缺失即视为"没配发布签名"）：
         *
         *   HEYTA_RELEASE_STORE_FILE        keystore 的**绝对路径**
         *   HEYTA_RELEASE_STORE_PASSWORD    仓库口令
         *   HEYTA_RELEASE_KEY_ALIAS         key 别名
         *   HEYTA_RELEASE_KEY_PASSWORD      key 口令
         *
         * ⚠️ `RELEASE_KEY_ALIAS`/`_STORE_PASSWORD` 这些名字与 React Native 官方文档
         * 一致，但**不带 `MYAPP_` 前缀**：那是模板占位名，照抄会变成第二套命名。
         *
         * 🔴 **必须整块 `if` 包起来。** 本块在**配置阶段**就会求值，
         * 而没配发布签名时 `heytaReleaseStoreFile` 是 `null` ——
         * `file(null)` 会直接抛 `Cannot convert 'null' to File`，
         * 于是**连 debug 构建都跑不起来**。第一版正是这么写的，真机一跑就炸。
         */
        if (heytaHasReleaseSigning) {
            release {
                storeFile file(heytaReleaseStoreFile)
                storePassword heytaReleaseStorePassword
                keyAlias heytaReleaseKeyAlias
                keyPassword heytaReleaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            /**
             * 🔴 **配了发布签名就用它，没配才回退调试签名 —— 但回退必须出声。**
             *
             * 为什么不直接 `throw`：现在还需要用 `bundleRelease` 出**内测包**，
             * 卡死会把这条路的产物也一起断掉。所以允许回退。
             *
             * 为什么必须出声：**调试 keystore 是公开的**
             * （`storePassword 'android'` / `keyPassword 'android'` 就写在上面，
             * 全世界的 RN 项目共用同一把）。一个用公开密钥签名的 release 包，
             * 任何人都能签出"同一应用"的更新包 —— 这不是"不够正式"，
             * 是**能给恶意更新用同一个身份**。所以它绝不能是默默发生的。
             *
             * ⚠️ 这也是本仓反复出现的那类缺口的又一例：
             * **回退本身不错，无声的回退才错。**
             */
            signingConfig heytaHasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

/**
 * 🔴 明文 HTTP 的开关必须在**这里**，不能写在 `android { }` 里。
 *
 * `@react-native/gradle-plugin` 的实现（`AgpConfiguratorUtils.kt`）是：
 *
 *     .finalizeDsl { ext ->
 *       ext.buildTypes {
 *         getByName("release").apply { manifestPlaceholders["usesCleartextTraffic"] = "false" }
 *       }
 *     }
 *
 * `finalizeDsl` 在 build script 求值**之后**才跑，所以写在 `android { }` 里的
 * `manifestPlaceholders` 一定会被它覆盖 —— 实测就是这样：构建退出码 0、
 * 日志一切正常，而 aapt2 从产物里读出来仍然是 `=false`。
 * **构建成功不等于配置生效，必须验证产物。**
 *
 * 这里再注册一个 finalizeDsl。AGP 按**注册顺序**回调，而插件是在
 * `apply plugin: "com.facebook.react"`（本文件第 3 行）时注册的，比这里早，
 * 所以本回调后跑，最后一次写入才是我要的值。
 *
 * 改完务必用 aapt2 验证产物，别只看脚本：
 *   aapt2 dump xmltree --file AndroidManifest.xml app-release.apk | grep usesCleartextTraffic
 *   期望 =true
 */
androidComponents {
    finalizeDsl { ext ->
        ext.buildTypes.getByName("release").manifestPlaceholders["usesCleartextTraffic"] = "true"
    }
}


// 🔴 让 JS 打包任务**真的**依赖 workspace 包（`packages`）的构建产物。
//
// 背景：`@heyta/mobile` 通过 `@heyta/app-host` 等 workspace 包消费仓库里的 `packages`，
// 而它们的入口是 `dist/index.js`（`main` / `exports` 都指过去，Metro 没有别名）。
//
// 但 React Native 的 Gradle 插件给 `createBundle<变体>JsAndAssets` 声明的输入
// 只覆盖本工程自己的 JS 源与配置，**不包括 monorepo 里 `packages` 的 `dist`**。
// 后果：只改 `packages`（不碰 `apps/mobile/src`）时，Gradle 认为打包任务 UP-TO-DATE、
// **根本不调用 Metro**，打出来的 APK 里是**上一次的旧 bundle**。
//
// 实测（这就是它的危险之处）：
//   - 往 `packages/app-host/src/actions.ts` 注入一个真 bug，`pnpm -r build` 之后
//     `./gradlew assembleRelease` 报 BUILD SUCCESSFUL（12 秒，打包任务被跳过）；
//   - 装到模拟器上跑验收，**40/0 全绿** —— 界面、同步、跨设备全对，
//     因为设备上跑的是**没有 bug 的旧代码**；
//   - 加 `--rerun-tasks` 强制重打后，同一个注入立刻让验收红了 2 项。
//
// 也就是说这个漏配会让"重建 → 安装 → 验收"整套**对着旧产物报成功** ——
// 它污染的不是某个功能，而是**所有移动端验收的结论**。
//
// 修法：把 `packages` 显式声明成打包任务的输入。声明整个 `packages` 而不是只声明
// `dist`，是因为 `inputs.dir` 会递归做内容哈希，而 `packages` 下没有 `node_modules`
// （pnpm 提升到根），成本很低；覆盖面反而更全。
//
// ⚠️ 实测：声明之后，即使 `packages` 没有任何改动，打包任务也常常会重跑
//（增量缓存似乎就此失效）。方向是**安全**的 —— 宁可重打一次，也不能打旧包 ——
// 代价是 APK 构建从 ~12 秒变成 ~30 秒。**不要**为了省这 20 秒把这条声明删掉。
//
// ⚠️ 本注释刻意全部用 `//`，不用块注释：Groovy 的块注释**不能嵌套**，
// 而注释里必然会出现 `packages/*/dist` 这种写法 —— 其中的 `*/` 会提前闭合注释，
// 剩下的中文就变成了代码，构建报 "Unexpected character" 而且行号指向注释中间。
tasks.configureEach { task ->
    if (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")) {
        task.inputs.dir(new File(rootProject.projectDir, "../../../packages"))
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
