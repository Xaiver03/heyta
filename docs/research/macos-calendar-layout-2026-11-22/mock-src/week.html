<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{--rail:64px;--side:236px;--bg:#f7f8fa;--line:#e8ebf0;--line2:#eef1f5;--ink:#0f172a;--muted:#64748b;--subtle:#94a3b8;--primary:#2563eb;--primary-subtle:#e8f0fe;--chip-b:#dbe7ff;--chip-bt:#1d4ed8;--chip-g:#dcf3e6;--chip-gt:#0f9d58;--chip-p:#f1e3fb;--chip-pt:#8e44ad;--chip-o:#ffe8d6;--chip-ot:#c2410c}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"PingFang SC","SF Pro Text",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.app{display:flex;height:900px;width:1440px;overflow:hidden}
.rail{width:var(--rail);flex:0 0 var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-right:1px solid var(--line2)}
.rail .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#475569}.rail .ic.act{background:var(--primary-subtle);color:var(--primary)}
.rail .av{width:34px;height:34px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:6px}.rail .sp{flex:1}.rail svg{width:20px;height:20px}
.side{width:var(--side);flex:0 0 var(--side);background:var(--bg);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:10px 12px}
.mini{border-radius:14px;background:#fff;padding:8px 10px 10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.mini .mh{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;padding:2px 2px 8px}.mini .mh .nav{display:flex;gap:2px;color:var(--subtle)}.mini .mh .today-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.mini .wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--subtle);margin-bottom:2px}.mini .days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center;font-size:11.5px;color:var(--ink)}
.mini .days .o{color:#cbd5e1}.mini .days .t{background:var(--primary);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;margin:0 auto}
.side h5{font-size:11px;color:var(--subtle);font-weight:600;margin:16px 4px 6px}
.cal-row{display:flex;align-items:center;gap:9px;padding:6px;border-radius:8px;font-size:13.5px}.cal-row.sel{background:#e9edf3}
.cb{width:15px;height:15px;border-radius:4px;flex:0 0 15px;display:flex;align-items:center;justify-content:center;color:#fff}.cb svg{width:11px;height:11px}
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.toolbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line2)}
.tbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475569}.tbtn.add{color:var(--primary);font-size:22px}.tbtn svg{width:19px;height:19px}
.seg{margin-left:auto;display:flex;gap:2px;background:#eef1f5;border-radius:11px;padding:3px}.seg div{padding:5px 16px;border-radius:8px;font-size:13.5px;color:var(--muted);font-weight:500}.seg div.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.1);font-weight:600}
.titlebar{height:70px;display:flex;align-items:center;padding:0 22px}.titlebar .big{font-size:34px;font-weight:700}.titlebar .range{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}.titlebar .range .arw{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#475569}.titlebar .range .tdy{border:1px solid var(--line);border-radius:16px;padding:5px 14px;color:var(--ink);font-weight:500}
.weekwrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 22px 16px}
.wh{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line)}
.wh .g{grid-column:1;display:flex;align-items:flex-end;justify-content:center;font-size:11px;color:var(--subtle);padding-bottom:8px}
.wh .d{text-align:center;padding:6px 0 8px;border-left:1px solid var(--line2)}.wh .d .n{font-size:19px;font-weight:600}.wh .d .w{font-size:12px;color:var(--muted)}.wh .d.today .n{color:#fff;background:var(--primary);border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
.allday{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line);min-height:40px;align-items:center}
.allday .lbl{font-size:11px;color:var(--subtle);text-align:center}.allday .c{border-left:1px solid var(--line2);padding:3px 4px;min-height:40px}
.chip{display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip i{width:6px;height:6px;border-radius:2px;background:currentColor;flex:0 0 6px}
.b{background:var(--chip-b);color:var(--chip-bt)}.g{background:var(--chip-g);color:var(--chip-gt)}.p{background:var(--chip-p);color:var(--chip-pt)}.o{background:var(--chip-o);color:var(--chip-ot)}
.tg{flex:1;display:grid;grid-template-columns:56px repeat(7,1fr);overflow:hidden}
.tg .gut{position:relative}
.tg .gut .h{position:absolute;right:8px;font-size:11px;color:var(--subtle);transform:translateY(-50%)}
.tg .col{border-left:1px solid var(--line2);position:relative}
.tg .col .hr{border-top:1px solid var(--line2);height:60px}
.tg .col .half{border-top:1px dashed #f1f3f7;height:0}
.ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:11.5px;font-weight:600;overflow:hidden}
</style></head><body><div class="app">
<div class="rail"><div class="av">邓</div>
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
<div class="ic act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></div>
<div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12l5 5L20 6"/></svg></div>

<div class="side">
<div class="mini"><div class="mh"><span>2026 年 11 月</span><span class="nav"><span>‹</span><span class="today-dot">○</span><span>›</span></span></div>
<div class="wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
<div class="days"><span class="o">26</span><span class="o">27</span><span class="o">28</span><span class="o">29</span><span class="o">30</span><span class="o">31</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span class="t">22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span class="o">1</span><span class="o">2</span><span class="o">3</span><span class="o">4</span><span class="o">5</span><span class="o">6</span></div></div>
<h5>我的日历</h5>

</div>

<div class="seg"><div>日</div><div class="on">周</div><div>月</div><div>年</div></div>

<div class="tbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></div></div>
<div class="titlebar"><div class="big">2026 年 11 月 16 — 22 日</div><div class="range"><span class="arw">‹</span><span class="tdy">今天</span><span class="arw">›</span></div></div>

<script>
const startH=8,endH=21;
const gut=document.getElementById('tg');
const gcol=document.createElement('div');gcol.className='gut';
for(let h=startH;h<=endH;h++){const s=document.createElement('div');s.className='h';s.style.top=((h-startH)*60)+'px';s.textContent=(h<12?'上午':(h===12?'正午':(h<18?'下午':'晚上')))+(h===12?'':((h>12?h-12:h)+'时'));gcol.appendChild(s)}
gut.appendChild(gcol);
for(let d=0;d<7;d++){const col=document.createElement('div');col.className='col';
 for(let h=startH;h<endH;h++){const r=document.createElement('div');r.className='hr';col.appendChild(r)}
 gut.appendChild(col);
}
// 定向事件
const evs=[
 {d:0,top:1,left:0.04,right:0.52,h:1.0,cls:'b',t:'产品周会'},
 {d:1,top:2,left:0.04,right:0.72,h:1.5,cls:'g',t:'需求澄清'},
 {d:2,top:3,left:0.28,right:0.96,h:1.0,cls:'o',t:'客户电话'},
 {d:3,top:5,left:0.04,right:0.6,h:1.0,cls:'p',t:'设计评审'},
 {d:4,top:6,left:0.2,right:0.88,h:1.5,cls:'b',t:'写周报'},
 {d:6,top:9,left:0.04,right:0.6,h:1.0,cls:'g',t:'整理桌面'},
];
const cols=gut.querySelectorAll('.col');
evs.forEach(e=>{const c=cols[e.d];const ev=document.createElement('div');ev.className='ev '+e.cls;
 ev.style.top=(e.top*60)+'px';ev.style.height=(e.h*60-2)+'px';ev.style.left=(e.left*100)+'%';ev.style.right=((1-e.right)*100)+'%';ev.textContent=e.t;c.appendChild(ev)});
</script></body></html>
