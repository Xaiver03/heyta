<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
:root{
  --rail:64px; --side:236px; --bg:#f7f8fa; --panel:#ffffff; --line:#e8ebf0; --line2:#eef1f5;
  --ink:#0f172a; --muted:#64748b; --subtle:#94a3b8; --primary:#2563eb; --primary-subtle:#e8f0fe;
  --chip-b:#dbe7ff; --chip-bt:#1d4ed8; --chip-g:#dcf3e6; --chip-gt:#0f9d58; --chip-p:#f1e3fb; --chip-pt:#8e44ad; --chip-o:#ffe8d6; --chip-ot:#c2410c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","SF Pro Text",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.app{display:flex;height:900px;width:1440px;overflow:hidden}
/* rail */
.rail{width:var(--rail);flex:0 0 var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-right:1px solid var(--line2)}
.rail .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#475569}
.rail .ic.act{background:var(--primary-subtle);color:var(--primary)}
.rail .av{width:34px;height:34px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:6px}
.rail .sp{flex:1}
.rail svg{width:20px;height:20px}
/* sidebar */
.side{width:var(--side);flex:0 0 var(--side);background:var(--bg);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:10px 12px 12px}
.mini{border-radius:14px;background:#fff;padding:8px 10px 10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.mini .mh{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;padding:2px 2px 8px}
.mini .mh .nav{display:flex;gap:2px;color:var(--subtle)}
.mini .mh .nav span{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.mini .mh .today-dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.mini .wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--subtle);margin-bottom:2px}
.mini .days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center;font-size:11.5px;color:var(--ink)}
.mini .days .o{color:#cbd5e1}
.mini .days .t{background:var(--primary);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;margin:0 auto}
.mini .days .sel{background:var(--primary-subtle);color:var(--primary);border-radius:8px;width:22px;height:20px;line-height:20px;margin:0 auto}
.side h5{font-size:11px;color:var(--subtle);font-weight:600;margin:16px 4px 6px;letter-spacing:.02em}
.cal-list{display:flex;flex-direction:column;gap:1px}
.cal-row{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;font-size:13.5px}
.cal-row.sel{background:#e9edf3}
.cb{width:15px;height:15px;border-radius:4px;flex:0 0 15px;display:flex;align-items:center;justify-content:center;color:#fff}
.cb svg{width:11px;height:11px}
/* content */
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.toolbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line2)}
.tbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#475569}
.tbtn.add{color:var(--primary);font-size:22px;font-weight:300}
.tbtn svg{width:19px;height:19px}
.seg{margin-left:auto;display:flex;gap:2px;background:#eef1f5;border-radius:11px;padding:3px}
.seg div{padding:5px 16px;border-radius:8px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg div.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.10);font-weight:600}
.titlebar{height:74px;display:flex;align-items:center;padding:0 22px}
.titlebar .big{font-size:34px;font-weight:700;letter-spacing:.01em}
.titlebar .range{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.titlebar .range .arw{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#475569}
.titlebar .range .tdy{border:1px solid var(--line);border-radius:16px;padding:5px 14px;color:var(--ink);font-weight:500}
.gridwrap{flex:1;display:flex;flex-direction:column;padding:0 22px 18px;min-height:0}
.wh{display:grid;grid-template-columns:repeat(7,1fr);height:40px;align-items:center;color:var(--muted);font-size:13px;font-weight:500;border-bottom:1px solid var(--line)}
.wh div{text-align:center}
.wk-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 8px;min-height:0;display:flex;flex-direction:column;gap:4px}
.cell .dn{font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.cell .dn .sun{color:#ef4444}
.cell.dim .dn{color:#c3ccd8;font-weight:500}
.cell .dn .num.today{background:var(--primary);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{width:6px;height:6px;border-radius:2px;background:currentColor;flex:0 0 6px}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.b{background:var(--chip-b);color:var(--chip-bt)} .g{background:var(--chip-g);color:var(--chip-gt)}
.p{background:var(--chip-p);color:var(--chip-pt)} .o{background:var(--chip-o);color:var(--chip-ot)}
</style></head>
<body><div class="app">
  <div class="rail">
    <div class="av">邓</div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
    <div class="ic act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12l5 5L20 6"/></svg></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
    <div class="sp"></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg></div>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg></div>
  </div>

  <div class="side">
    <div class="mini">
      <div class="mh"><span>2026 年 11 月</span><span class="nav"><span>‹</span><span class="today-dot">○</span><span>›</span></span></div>
      <div class="wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="days">
        <span class="o">26</span><span class="o">27</span><span class="o">28</span><span class="o">29</span><span class="o">30</span><span class="o">31</span><span>1</span>
        <span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
        <span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span>
        <span>16</span><span class="sel">17</span><span>18</span><span>19</span><span>20</span><span>21</span><span class="t">22</span>
        <span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span>
        <span>30</span><span class="o">1</span><span class="o">2</span><span class="o">3</span><span class="o">4</span><span class="o">5</span><span class="o">6</span>
      </div>
    </div>
    <h5>我的日历</h5>
    <div class="cal-list">
      <div class="cal-row sel"><span class="cb" style="background:#2563eb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>所有</div>
      <div class="cal-row"><span class="cb" style="background:#0f9d58"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>工作</div>
      <div class="cal-row"><span class="cb" style="background:#8e44ad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>个人</div>
      <div class="cal-row"><span class="cb" style="background:#c2410c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>学习</div>
    </div>
    <h5>标签</h5>
    <div class="cal-list">
      <div class="cal-row"><span class="cb" style="background:#0ea5e9"></span>重要</div>
    </div>
    <div class="sp"></div>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="tbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></div>
      <div class="tbtn add">＋</div>
      <div class="seg"><div>日</div><div>周</div><div class="on">月</div><div>年</div></div>
      <div class="tbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
      <div class="tbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></div>
    </div>

    <div class="titlebar">
      <div class="big">2026 年 11 月</div>
      <div class="range"><span class="arw">‹</span><span class="tdy">今天</span><span class="arw">›</span></div>
    </div>

    <div class="gridwrap">
      <div class="wh"><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div class="sun">周六</div><div class="sun">周日</div></div>
      <div class="wk-grid" id="grid"></div>
    </div>
  </div>
</div>
<script>
const firstColMonday = 26; // 2026-11-26? build Oct26 start (6 weeks Mon-start)
// Nov 2026: Nov 1 is Sunday -> Monday-start week begins Oct 26. 42 cells.
const start = new Date(2026,9,26); // Oct 26 2026
const events = {
 '2026-11-03':[['b','评审 v2 设计稿']],
 '2026-11-05':[['o','客户电话 · 3:00 下午']],
 '2026-11-06':[['g','周报截止']],
 '2026-11-10':[['b','产品周会'],['p','生日提醒']],
 '2026-11-12':[['o','体检 9:30']],
 '2026-11-16':[['g','提交季度总结']],
 '2026-11-17':[['b','需求澄清'],['o','午饭 · 老同学']],
 '2026-11-19':[['p','纪念日']],
 '2026-11-22':[['b','整理桌面'],['g','健身打卡']],
 '2026-11-24':[['o','出差 · 上海']],
 '2026-11-26':[['g','发版']],
 '2026-11-27':[['b','复盘会']],
 '2026-12-01':[['p','月度计划']],
};
const g=document.getElementById('grid');
const pad=n=>String(n).padStart(2,'0');
for(let i=0;i<42;i++){
  const d=new Date(start); d.setDate(start.getDate()+i);
  const inMonth = d.getMonth()===10;
  const key = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const today = key==='2026-11-22';
  const cell=document.createElement('div'); cell.className='cell'+(inMonth?'':' dim');
  const dn=document.createElement('div'); dn.className='dn';
  const dow=d.getDay();
  const num=document.createElement('span'); num.className='num'+(today?' today':''); num.textContent=d.getDate();
  dn.appendChild(num);
  cell.appendChild(dn);
  (events[key]||[]).forEach(([c,t])=>{
    const ch=document.createElement('span'); ch.className='chip '+c;
    ch.innerHTML='<i></i><span class="t">'+t+'</span>'; cell.appendChild(ch);
  });
  g.appendChild(cell);
}
</script></body></html>
