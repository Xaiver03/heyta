# heyta 产品站：heyta.waytofuture.cn
# ==================================
#
# 🔴 2026-09-30：本域名从 heyta.finlaw.cloud 迁来。迁移动机与代价见
#    docs/runbooks/deployment.md §3.7.2。一句话：`heyta.waytofuture.cn`
#    是本主体已备案主域 `waytofuture.cn` 的子域，腾讯云 ICP APP 备案
#    （订单 30179057320250614）三平台填报的就是它，因此它必须真的
#    提供应用本体，而不是只做解析。
#
# 与 heyta.finlaw.cloud 的唯一差别是 `server_name` 与证书路径；
# 那份站点仍保留在 sites-enabled 里作回滚路径（**不是入口**）。
#
# 🔴 WEBAUTHN_RP_ID 只能取一个值 ⇒ 换域名后旧域名上注册的 passkey 全部失效，
#    测试者要重新注册。这不可两边兼容（与 2026-09-27 那次迁移同一代价）。
#
# 其余内容（/app/ 的 --base=/app/ 纪律、/robots.txt 与 /sitemap.xml 的诚实 404、
# /health 必须代理而不能落进 SPA 兜底、三张凭据页与其脚本同域、HTML 不启发式缓存）
# 逐条沿用自 heyta.finlaw.cloud，理由见那里的注释。
#
server {
    server_name heyta.waytofuture.cn;

    root /var/www/heyta-landing;
    index index.html;

    # ── 未命中地址答**我们自己那一页**，而不是 nginx 的裸默认页（缺口 G-35）────
    #
    # 🔴 2026-10-02 补。之前 `/legal/` 下拼错的地址已经是**真 404**（G-25b 修掉了
    #    "200 + 首页字节"那个谎），但答的是 nginx 自己的模板：截图里只有
    #    `404 Not Found` 与 `nginx/1.18.0 (Ubuntu)` 两行 —— 没有品牌、没有任何
    #    能点的入口，并且**把服务器版本暴露给任意外部访客**。
    #
    # 🔴 **必须是 `error_page`，不能是 `try_files … /404.html`**。后者是"把状态码
    #    又变回 200"的那台机器 —— G-25b 刚花一轮把它拆掉：`try_files` 的最后一项
    #    是一次**内部重写**，重写成功后 nginx 按新 URI 的成败定状态码，于是
    #    "不存在"重新变成"存在"。`error_page 404 /404.html;`（**不带 `=`**）走的是
    #    内部跳转，`=` 才会改写状态码 —— 少了那个等号，响应码保持 404。
    #    ⚠️ 写成 `error_page 404 = /404.html;` 会**恰好撤销这次修复**，
    #       而它在本机跑起来看起来完全正常（页面出来了、样式也对了）。
    #
    # 📌 `/404.html` 与 `/en/404.html` 是**生成物**：
    #    apps/landing/scripts/notfound-template.html → `gen-entries.mjs` →
    #    apps/landing/public/{,en/}404.html → Vite 原样拷进站点根。
    #    文案在 `packages/i18n`（`site.notfound.*`），色值来自设计系统 token，
    #    所以这一页不需要构建产物、也不会因为"镜像没跟上"而白屏 —— 它存在的意义
    #    恰恰是在事情不对的时候还能说话。
    #
    # ⚠️ 这一条**不影响 `/api/` 的 404**：`proxy_intercept_errors` 默认 off，
    #    `error_page` 只接管 nginx **自己生成**的错误，上游返回的错误原样透传。
    #    线上有判据（e2e/live-site/live-legal.spec.ts 断言 API 的 404 仍是 JSON）。
    server_tokens off;
    error_page 404 /404.html;

    # 同步服务的快照生成 / 大导入会走这里。heyta-tmp 那个站点设的是 64m，
    # 这份必须对齐 —— 否则"换个域名"会悄悄把大文件同步变成 413。
    client_max_body_size 64m;

    # 文件名带内容哈希：改名才变内容，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🔴 这两个文件必须"缺了就 404"。
    #    /robots.txt 缺失时，这里是爬虫唯一能拿到的信号 —— 一旦它落到某个
    #    HTML 兜底上（**历史形状**：`location /` 的 `try_files … /index.html`），
    #    爬虫拿到的是一份 HTML 而不是"没有 robots"。那比没有这个文件更坏：
    #    文件不存在时爬虫按默认全站可抓，给它 HTML 反而是一次解析失败，
    #    而且**没有任何报错**。与 /health、/terms.html、`/*.js`、/en/assets
    #    是同一类坑，第四次见。
    #
    #    ⚠️ 2026-10-19 起 `location /` 已经不再有 SPA 兜底（改成 `=404`），
    #       所以这两条**今天已经是双保险**。留着它们不是冗余洁癖：它们把
    #       "这两个文件不许被任何兜底接管"写成了一条**只作用于这两个路径**的
    #       局部规则，而不是依赖"整站兜底恰好不存在"这个全局性质 ——
    #       下一个人要是给 `location /` 加回兜底（比如为了某个前端路由），
    #       这两条仍然守得住。
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /sitemap.xml {
        try_files $uri =404;
    }

    # ── 应用本体：https://heyta.waytofuture.cn/app/ ─────────────────────
    #
    # 🔴 在此之前本域名**没有** /app/ 这个 location，于是 /app/ 掉进下面的
    #    `try_files ... /index.html`（**历史形状**：2026-10-19 起那是 `=404`，
    #    见文末「站点兜底」那段），返回的是**落地页**（HTTP 200、标题也是
    #    落地页的）—— 一个"看起来能用、点进去是另一个页面"的谎，而且不报错。
    #    应用入口是落地页唯一的转化路径，所以这条必须真的通。
    #
    # 🔴 这份产物**必须**用 `vite build --base=/app/` 构建（已核对线上
    #    index.html 引用的是 /app/assets/…）。默认构建的资源是根绝对路径，
    #    挂在 /app/ 下会去请求本域名的 /assets/… → 落到落地页的资源上，
    #    控制台报样式表 MIME 是 application/json（这个坑在 heyta-tmp 上踩过一次）。
    #
    # `/app`（无尾斜杠）必须单独兜一下：nginx 的 `location /app/` **不匹配**
    # `/app`，而落地页给出的应用地址去掉尾斜杠是**故意**的
    # （见 apps/landing/src/lib/app-url.ts 的规范化）。用 `= /app` 精确匹配
    # 而不是 `location /app`：后者会把 /application 也吃掉。
    # `$is_args$args` 是为了把落地页带过来的 `?lang=en` 一起送过去
    # （见 app-url.ts 的 withLocale —— 英文落地页靠它让应用也开英文）。
    location = /app { return 301 /app/$is_args$args; }

    location /app/assets/ {
        alias /var/www/heyta-app/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 🔴 2026-09-27 补：`.wasm` 必须以 `application/wasm` 返回。
        #    本机的 `/etc/nginx/mime.types` **没有** wasm 这一条，于是 nginx 给的是
        #    `application/octet-stream`；浏览器据此**拒绝** `instantiateStreaming`
        #    （"Incorrect response MIME type. Expected 'application/wasm'"），
        #    再回退到 ArrayBuffer 实例化 —— **能跑，但慢，而且控制台永远是红的**。
        #    这正是那种"不报错就不管"的坑：功能看起来正常，只有打开控制台才看得见。
        #
        # ⚠️ `types` 在嵌套层级是**替换**继承，不是叠加：只写 wasm 会让同目录下的
        #    `.js` / `.css` 一起失去类型（变成默认 `text/plain`，模块脚本直接不执行）。
        #    所以必须先把全局 mime.types include 回来，再补这一条。
        include /etc/nginx/mime.types;
        types {
            application/wasm wasm;
        }
    }

    location /app/ {
        alias /var/www/heyta-app/;
        index index.html;
        # 与落地页同一条纪律：HTML 不能被浏览器启发式缓存。发布时旧分片被清掉，
        # 拿着旧 HTML 的人会去请求不存在的 JS → 白屏。
        # `no-cache` 不是"不缓存"，是"用前必须带 ETag 来确认"。
        add_header Cache-Control "no-cache" always;
        # 🔴 2026-10-04 补（G-60）：`.webmanifest` 必须以 `application/manifest+json` 返回。
        #    本机 `/etc/nginx/mime.types`（nginx/1.18.0 Ubuntu）里**没有** webmanifest 这一条，
        #    于是 `/app/manifest.webmanifest` 给的是 `application/octet-stream` —— 与上面那条
        #    `.wasm` 是同一个根因的第二次。它**不挡安装性**（浏览器对清单是否可装的判据里
        #    没有 content-type 这一条），但它是"清单面板/控制台报错"那一类：功能看着正常，
        #    只有打开面板才看得见。更要紧的是自托管那侧的验收用例
        #    （e2e/selfhost-stack/selfhost-web.spec.ts 断言 `application/manifest+json`）**是绿的**，
        #    也就是说外人自建的那一套与我们托管的这一套在同一个文件上给了两个答案 ——
        #    用户拿我们的文档排查时会撞见"我这边和官方那边不一样"。
        # ⚠️ 同上一条纪律：`types` 在嵌套层级是**替换**继承，不是叠加。只写 webmanifest
        #    会让 /app/ 下的 .js / .css / .png 一起失去类型。必须先把全局 mime.types include 回来。
        include /etc/nginx/mime.types;
        types {
            application/manifest+json webmanifest;
        }
        try_files $uri $uri/index.html /app/index.html;
    }

    # ── 运营后台入口：https://heyta.waytofuture.cn/admin ─────────────────
    #
    # 后台**不是第二个应用**：ADR-0038 §2 第一条定的是"主应用里的一个受保护子树"，
    # 产物只有 apps/web 那一份。这里只是给运营者一个能直接敲的地址，
    # 里面的内容区按 pathname 换成后台壳（apps/web/src/features/admin/route.ts）。
    #
    # 🔴 这个 location **本身不是访问控制**：任何人都能打开这个地址，
    # 看到的是一个说明原因的页面。数据由服务端每条路由上的 `requireAdmin` 裁决
    # （ADR-0038 §4.3「服务端是唯一裁决者」）。
    #
    # 🔴 为什么必须显式列这一条：本站 `location /` 自 2026-10-19 起是 `=404`
    #    （没有 SPA 兜底），所以 `/admin` 在加这一条之前的实测是**真 404**。
    #    这与 /app/、/health、三张凭据页是同一族：地址要有自己的 location。
    #
    # `alias` 指到**那一个文件**：这条是精确匹配，只需要那份 HTML。里面的资源引用是
    # /app/assets/…（构建时 --base=/app/），分片走上面那条 location /app/assets/，
    # 所以不需要为 /admin 复制第二份产物。
    # `/admin`（不带尾斜杠）与 `/admin/`（带）都收：`/admin/` 301 到 `/admin`，
    # 免得同一个界面有两个正规地址。
    location = /admin {
        alias /var/www/heyta-app/index.html;
        # 与 /app/ 同一条纪律：HTML 不许被浏览器启发式缓存 —— 发布时旧分片被清掉，
        # 拿着旧 HTML 的人会去请求不存在的 JS，症状是白屏。
        add_header Cache-Control "no-cache" always;
    }

    location = /admin/ { return 301 /admin; }

    # ── 同步服务端：/api/（含 WebSocket /api/sync/ws）────────────────
    # 与 heyta-tmp 的 `location /` 用同一个上游、同一组超时；这里按前缀收窄，
    # 因为本域名的 / 属于落地页。
    location /api/ {
        proxy_pass http://127.0.0.1:1900;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── 健康检查：/health（含 DB 连通性）与 /live（存活）──────────────
    # 🔴 2026-09-27 发现：本域名**没有**这两个 location，于是它们掉进下面
    #    `location /` 的 `try_files ... /index.html`，返回的是**落地页**
    #    （HTTP 200、Content-Type: text/html）。监控探针看到 200 就以为活着 ——
    #    这是最坏的一类：**不报错，只是永远绿**。
    #    旧域名因为 `location /` 整体代理到 1900，一直是好的；迁移时这份
    #    "顺带就有"的能力没被带过来。
    location ~ ^/(health|live)$ {
        proxy_pass http://127.0.0.1:1900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 法律页：/terms.html 与 /privacy.html ──────────────────────────
    # 🔴 2026-09-27 发现：本域名**没有**这两个 location，于是它们掉进下面
    #    `location /` 的 SPA 兜底，返回的是**落地页** —— HTTP 200、text/html，
    #    且与 /var/www/heyta-landing/index.html **逐字节相同**（实测，2370 字节）。
    #    也就是说「服务条款」这个地址，打开是营销页。
    #    最坏的一类：不报错、状态码 200。做 KYC / 上架审查的人点开看到"正常打开"
    #    就走了，而条款根本不存在。
    #    服务端的设计是**诚实的 404**（server.ts："A 404 is the honest failure"）——
    #    只有代理过去才拿得到它；操作者真发布了也会自然变成那个真文件。
    location ~ ^/(terms|privacy)\.html$ {
        proxy_pass http://127.0.0.1:1900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 服务端的三张凭据页（server/src/pages.ts）─────────────────────
    # 🔴 它们**必须**和 API 在同一个域名：迁移后 PUBLIC_URL 指向本域名，
    #    邮件里的魔法登录链接、passkey 恢复链接都会落到这里。
    #    不代理的话这些链接会掉进落地页 —— 用户"点登录，打开了官网"。
    location ~ ^/(verify-email|recover-passkey|magic-login)$ {
        proxy_pass http://127.0.0.1:1900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔴 三张凭据页的**脚本**也必须一起代理 —— 只代页不代脚本 = 页面画得出来、按钮是死的。
    #
    #    2026-09-27 实测：`/recover-passkey.js` 返回 **200 但 Content-Type 是 text/html**，
    #    内容其实是**落地页**（2370 字节，来自下面 `location /` 的
    #    `try_files ... /index.html`）。浏览器报 `Unexpected token '<'`，
    #    `window.SimpleWebAuthnBrowser === undefined`，于是「Register New Passkey」
    #    点了**一点反应都没有、零请求**。
    #
    #    后果不是"少个功能"：丢了通行密钥的用户**收到邮件 → 点开链接 → 按钮不动 → 进不去**。
    #    同一条缺陷也打死了**魔法登录链接**（`/magic-login-confirm.js` 同样被吞），
    #    也就是主要的登录路径 —— 而 curl 只看状态码时它是"200、很正常"。
    #
    #    只列这三个：它们是 `server/src/pages.ts` 里三张页面**真正引用**的脚本。
    #    `public/` 里另有 `app.js` / `style.css` / `eu-stars.svg`，那是服务端**自带
    #    standalone 首页**（`templates/index.template.html`）的资源；本域名 `/` 服务的是
    #    真正的落地页（/var/www/heyta-landing），那份首页在这里用不到 ——
    #    所以**故意不代**，免得把 `/style.css` 这种通用名字从落地页手里抢走。
    location ~ ^/(recover-passkey|magic-login-confirm)\.js$ {
        proxy_pass http://127.0.0.1:1900;
        proxy_set_header Host $host;
    }

    location = /simplewebauthn-browser.min.js {
        proxy_pass http://127.0.0.1:1900;
        proxy_set_header Host $host;
    }

    # 🔴 HTML **不能**被浏览器启发式缓存。
    #
    # 没有 Cache-Control 时，浏览器会按 (now - Last-Modified) 的 10% 猜一个新鲜期。
    # 而每次发布都会 rsync --delete 掉旧的带哈希分片，于是"手里拿着旧 HTML 的人"
    # 会去请求一个已经不存在的 JS，页面**直接白屏**（不是降级）。
    # `no-cache` 不是"不缓存"，是"每次用前必须用 ETag 找我确认" —— 没变就 304，很便宜。
    #
    # 顺带把 /en/ 的兜底也分开：`/en/` 下的未知路径要回落到**英文**入口。
    # 否则分享出去的 /en/xxx 会给英文用户一个中文页面，而爬虫也会抓到中文。
    #
    # 🔴 2026-09-27 补：`/en/assets/` 必须单独拦掉。两侧的 HTML 用的都是**绝对路径**
    #    （`src="/assets/…"`），所以页面本身没问题；但只要有人写一次相对路径、
    #    或某个工具去探 `/en/assets/x.js`，它就会掉进下面的 `/en/index.html` 兜底，
    #    拿到 **HTTP 200 + text/html**。那正是本域名已经踩过三次的同一类坑
    #    （见上方 /health、/terms.html、/*.js 三段）：**不报错，只是永远绿**。
    #    这里给一个诚实的 404 —— 资源真的不在 /en/ 下，就别假装它在。
    # ── 法务页：/legal/<id>/ 与 /en/legal/<id>/ —— 未命中必须**真 404** ──────
    #
    # 🔴 2026-10-02 补（缺口 G-25b）。这 18 个入口是**磁盘上真实存在的目录**
    #    （/var/www/heyta-landing/{,en/}legal/<id>/index.html，实测各 9 个），所以
    #    `try_files $uri $uri/` 就能服务它们；掉进下面的 `location /` 兜底的，
    #    只有**拼错或不存在**的地址。而那之前是 **HTTP 200 + 首页字节**：
    #    实测 `/legal/nope-not-a-doc/` 回 7022 字节、`<title>heyta：本地优先的任务管理…`，
    #    `/en/legal/nope-not-a-doc/` 回英文首页 —— 与上方 /robots.txt、/health、
    #    /terms.html、/*.js、/en/assets/ 是**同一类坑的第六次**：不报错，只是永远绿。
    #
    #    为什么这一条比别的更要紧：法务页的可达性是**备案材料与商店审核要点的链接**。
    #    "打开是营销页"看起来像成功，审核者与用户都不会报错。
    #
    #    🔴 **保留 $uri/**（deployment §3.7 的红线）：删了它 `/legal/terms`（无尾斜杠）
    #       会 404，而落地页与 footer 给的链接带尾斜杠、人手工输入的常常不带。
    #    ⚠️ 兜底目标**不是** `/legal/index.html` —— 磁盘上没有这个文件（实测 No such file），
    #       站点也没有注册 `/legal` 这个枢纽页，所以未命中只能 404，没有"更好的回落"可选。
    #       对照：`/help/xxx/` 那种"未注册子路径落到父级枢纽"在客户端是刻意的
    #       （apps/landing/src/site/paths.ts 的 pageFromPath 注释），父级存在时才成立。
    #
    #    🔴 **2026-10-19 之后这条从"局部例外"变成了"整站规则"**：`location /` 与
    #       `location /en/` 也改成 `=404` 了（见文末「站点兜底」那段）。副作用要登记：
    #       客户端那个"认不出路径就渲染首页"的回落（`pageFromPath`）在**整页加载**这条
    #       路径上从此几乎不可达 —— 因为服务端会先答 404 并送出品牌 404 页。
    #       它仍然有用：客户端路由/历史前进后退里 `pageFromPath` 照旧会被调用。
    #       ⇒ 不要再拿"nginx 的 SPA 兜底本来也是这样"当作那个客户回落的存在理由
    #       （那半边已被本轮改掉），理由只剩"渲染树不能白屏"。
    #
    #    ⚠️ 裸 `/legal/` 保持 **403**（目录在、没有 index、autoindex 关）—— 那是
    #       "这一层没有内容"，不是"伪装成成功"，本轮不顺手改。
    location /legal/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /en/legal/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
        # 🔴 上面 server 级那条会跳到**中文**那页。nginx 的 error_page 是
        #    **按 location 继承**的，所以英文子树里每个能产生 404 的 location
        #    都要各自指一次 —— 漏掉一个的症状不是报错，而是"英文页面下面
        #    挂着一张中文 404"，只有真的拼错一次才会被发现。
        error_page 404 /en/404.html;
    }

    location /en/assets/ {
        error_page 404 /en/404.html;
        return 404;
    }

    # `/docs/` is the single public help-center path. Keep old `/help` URLs as
    # compatibility redirects so stale app builds and bookmarks reach the same IA.
    location = /help {
        return 301 /docs/$is_args$args;
    }

    location = /help/ {
        return 301 /docs/$is_args$args;
    }

    location ~ ^/help/(.*)$ {
        return 301 /docs/$1$is_args$args;
    }

    location = /en/help {
        return 301 /en/docs/$is_args$args;
    }

    location = /en/help/ {
        return 301 /en/docs/$is_args$args;
    }

    location ~ ^/en/help/(.*)$ {
        return 301 /en/docs/$1$is_args$args;
    }
    location /en/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
        # 🔴 与上面 `/en/legal/` 那条同一个理由：`error_page` 按 location 继承，
        #    server 级那条跳的是**中文** 404 页。英文子树里每条能产生 404 的
        #    location 都要各自指一次，漏掉一个的症状不是报错，而是
        #    "英文页面下面挂着一张中文 404"。
        error_page 404 /en/404.html;
    }

    # ── 站点兜底：未注册的路径答**诚实 404**，不是"200 + 落地页" ────────────
    #
    # 🔴 2026-10-19 SEO 审计改的（此前是 `try_files $uri $uri/ /index.html;`）。
    #
    # **为什么原来的写法是 SEO 问题**，而不是"无害的便利"：
    # `location /` 的兜底让 /no-such-page/ 这类**任意**不存在的地址回
    # **HTTP 200 + 落地页字节**（实测：7022 字节、`<title>heyta：本地优先…`）。
    # 对爬虫来说这是一片**可以无限生成的软 404**：每一个拼错/瞎猜的路径都是一个
    # "存在的、与首页重复的页面"。它们各自声明 canonical 指向 `/`，于是症状是
    # 搜索控制台里的"重复网页，Google 选择了不同的规范网址"堆积 + 抓取预算被
    # 浪费在这种页面上 —— **而站内没有任何一处会因此报错**（与 /health、
    # /terms.html、`/*.js`、/en/assets、/legal/* 是同一类坑，这是第七次见）。
    #
    # **为什么现在可以安全地去掉兜底**：站点是"每页一个真目录"的静态入口
    # （ADR-0033），`$uri/` 已经足以服务全部已注册页面 —— 磁盘上没有任何一个
    # 可服务路径需要靠 `/index.html` 才能到达（app 与 api 各有自己的 location，
    # `/help*` 是 301）。`/legal/` 那条早就是这么做的，本轮把它推广到整站。
    #
    # **实测判据（2026-10-19，不是推断）**：用 `nginx:alpine` 起一次性容器跑
    # 同一组指令，逐条验过 —— `/`→200 首页、`/features/`→200、
    # `/en/`→200、`/features`（无尾斜杠）→**301 到 `/features/`**（保住"人手工
    # 输入不带尾斜杠"这条，见 §3.7 红线）、`/nope/`→**404 + 中文 404 页**、
    # `/en/nope/`→**404 + 英文 404 页**。
    # ⚠️ 版本差：本机验的是 `nginx:alpine`，线上是 `nginx/1.18.0 (Ubuntu)`。
    #    `$uri/` 落在目录首页这一条线上有先例（`/legal/` 一直在用），
    #    但**根路径 `/` 没有线上先例** —— 所以 `--apply` 之后的验收必须包含
    #    `/` 这条阳性对照（`e2e/live-site/live-seo.spec.ts`），别只看 404 那半边。
    #
    # 🔴 **去掉兜底之后，`error_page 404 /404.html` 才第一次在整站生效**：
    #    状态码保持 404、正文是那张双语品牌页（零 JS、零外链，见 G-35）。
    #    写成 `try_files … /404.html` 会**恰好撤销**这件事（把状态码变回 200）。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/heyta.waytofuture.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/heyta.waytofuture.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = heyta.waytofuture.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name heyta.waytofuture.cn;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
