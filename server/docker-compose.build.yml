# 本地构建覆盖文件（开发用）
#
# 用法：
#   ./scripts/deploy.sh --build
#   或直接：docker compose -f docker-compose.yml -f docker-compose.build.yml build supersync
#
# 🔧 heyta 改动：上游这里两条路径都按它自己的 monorepo 布局写死。
# compose 的 context 是相对**该 compose 文件所在目录**解析的：
#   context:    ../..                          上游 compose 在 packages/super-sync-server/（两层到仓库根）
#               ..                             heyta 在 server/（一层到仓库根）
#   dockerfile: packages/super-sync-server/Dockerfile
#               server/Dockerfile              heyta 的布局

services:
  supersync:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VCS_REF: ${SUPERSYNC_BUILD_SHA:-local}
        # Alpine 仓库源。默认官方 CDN（与不带这个参数的行为一致）；
        # 在连不上 dl-cdn.alpinelinux.org 的主机上用 APK_MIRROR 覆盖，
        # 否则 `apk add` 会**无声挂住**（Dockerfile 里有说明）。
        APK_MIRROR: ${APK_MIRROR:-dl-cdn.alpinelinux.org}
        # npm registry，同理：默认官方，连不上时用 NPM_REGISTRY 覆盖。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: supersync:local
    environment:
      - MIGRATE_RECOVERY_BUILD_LOCAL=true
